<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Sine-Affinity Pixel Flow (2D)</title>
<style>
  html,body{margin:0;padding:0;background:#050508;color:#ccc;
    font-family:'SF Mono',Consolas,monospace;overflow:hidden;height:100%}
  /* HUD 与舞台各占一列（HUD 参与布局，不再压在图上） */
  body{display:flex;align-items:stretch;gap:10px;padding:8px;box-sizing:border-box}
  #hud{flex:0 0 auto;align-self:flex-start;background:rgba(10,10,20,.82);
    backdrop-filter:blur(8px);border:1px solid #223;border-radius:8px;
    padding:10px 12px;font-size:12px;line-height:1.7;min-width:244px;z-index:2}
  #hud.min{min-width:0;padding:5px 8px;border-radius:6px}
  #hud h1{font-size:12px;margin:0 0 8px;color:#8cf;font-weight:600;cursor:pointer;
    user-select:none;white-space:nowrap}
  #hud.min label,#hud.min .row,#hud.min #fps{display:none}
  #hud.min h1{margin:0}
  #hud label{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #hud input[type=range]{width:110px}
  #hud select{background:#1a2440;color:#8cf;border:1px solid #345;border-radius:4px;
    font-family:inherit;font-size:11px;padding:2px 4px}
  #hud button{background:#1a2440;color:#8cf;border:1px solid #345;border-radius:4px;
    padding:4px 10px;cursor:pointer;font-family:inherit;font-size:11px;margin-top:4px}
  #hud button:hover{background:#253060}
  #hud .row{display:flex;gap:6px;margin-top:8px}
  #fps{color:#6f6;font-size:11px;margin-top:6px}
  /* 四视图：紧凑 2×2。方格边长由 JS 按可用空间算出（见 fitStage），
     轨道也用固定像素，避免 1fr 把两张图推到各自半区中心而"散开" */
  #stage{flex:1 1 auto;display:grid;min-width:0;min-height:0;
    place-content:center;gap:6px 8px}
  .cell{display:grid;grid-template-rows:auto 1fr;place-items:center;
    min-width:0;min-height:0}
  .cap{font-size:11px;color:#7a8cff;letter-spacing:.5px;white-space:nowrap;line-height:14px}
  .wrap{display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;min-width:0;min-height:0}
  canvas{display:block;image-rendering:pixelated;border:1px solid #1a1f33}
  #err{position:fixed;inset:0;padding:24px;background:#200;color:#f88;
    display:none;white-space:pre-wrap;font-size:13px;z-index:10}
</style>
</head>
<body>
<div id="hud">
  <h1 id="h1">▾ Sine-Affinity Pixel Flow (2D)</h1>
  <label>Gain ε <span id="epsV">0.000</span><input id="eps" type="range" min="-2" max="2" step="0.01" value="0.000"></label>
  <label>Speed <span id="spdV">1.00</span><input id="spd" type="range" min="0" max="3" step="0.05" value="1"></label>
  <label>Rounds/frame <span id="rndV">1</span><input id="rnd" type="range" min="1" max="4" step="1" value="1"></label>
  <label>Period X <span id="pxV">16</span><input id="px" type="range" min="6" max="48" step="1" value="16"></label>
  <label>Period Y <span id="pyV">20</span><input id="py" type="range" min="6" max="48" step="1" value="20"></label>
  <label>键源 <select id="kmode"><option value="0" selected>颜色明度</option><option value="1">颜色色相</option></select></label>
  <div class="row"><button id="pause">Pause</button><button id="step">Step</button><button id="reset">Reset</button></div>
  <div id="fps">FPS: --</div>
</div>
<div id="stage">
  <div class="cell"><div class="cap">像素图 color(RGBA)</div><div class="wrap"><canvas id="c"></canvas></div></div>
  <div class="cell"><div class="cap">位置相位场 phase(p)</div><div class="wrap"><canvas id="cphase"></canvas></div></div>
  <div class="cell"><div class="cap">决策图 swapped</div><div class="wrap"><canvas id="creq"></canvas></div></div>
  <div class="cell"><div class="cap">轴指示图 X/Y</div><div class="wrap"><canvas id="cpair"></canvas></div></div>
</div>
<div id="err"></div>

<script type="module">
const err = (msg) => {
  const e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = msg;
  console.error(msg);
};

if (!navigator.gpu) { err('此浏览器不支持 WebGPU。请使用 Chrome 113+ 或开启 flag。'); throw new Error('no webgpu'); }
const adapter = await navigator.gpu.requestAdapter();
if (!adapter) { err('无法获取 GPU adapter'); throw new Error('no adapter'); }
const device = await adapter.requestDevice();
device.addEventListener('uncapturederror', e => err('GPU 错误: ' + e.error.message));

const format = navigator.gpu.getPreferredCanvasFormat();
const mkCanvas = (id) => {
  const cv = document.getElementById(id);
  const cx = cv.getContext('webgpu');
  cx.configure({ device, format, alphaMode: 'opaque' });
  return { cv, cx };
};
const pix   = mkCanvas('c');       // 像素图
const phase = mkCanvas('cphase');  // 相位图
const req   = mkCanvas('creq');    // 请求图
const pair  = mkCanvas('cpair');   // 配对成功图

// ===== 尺寸 =====
const W = 32, H = 32;
const TOTAL = W * H;
const CELL_WORDS = 8;           // 8 * 4B = 32B / cell (swapped@0, color@16)
const REZ = 512;
for (const { cv } of [pix, phase, req, pair]) { cv.width = REZ; cv.height = REZ; }

// 紧凑 2×2：按舞台可用空间算出方格边长，轨道写死像素并整体居中。
// （用 1fr 分列时，两列各宽 500+，正方形只有短边大小，图就被推成"四散"了。）
const stageEl = document.getElementById('stage');
function fitStage() {
  const GAP_X = 8, GAP_Y = 6, CAP_H = 16;
  const availW = stageEl.clientWidth, availH = stageEl.clientHeight;
  if (availW <= 0 || availH <= 0) return;
  const side = Math.max(64, Math.floor(Math.min(
    (availW - GAP_X) / 2, (availH - GAP_Y) / 2 - CAP_H)));
  for (const { cv } of [pix, phase, req, pair]) {
    cv.style.width = side + 'px';
    cv.style.height = side + 'px';
  }
  stageEl.style.gridTemplateColumns = `${side}px ${side}px`;
  stageEl.style.gridTemplateRows = `${side + CAP_H}px ${side + CAP_H}px`;
}
new ResizeObserver(fitStage).observe(stageEl);
fitStage();

// 单 Pass 方案：不再需要 cmd / stage 字段（无 NOPE 散点，所有格子都参与交换）

// ===== 确定性随机（Reset 后可复现） =====
function hash32(x) {
  x = (x ^ 61) ^ (x >>> 16);
  x = (x + (x << 3)) | 0;
  x = x ^ (x >>> 4);
  x = Math.imul(x, 0x27d4eb2d);
  x = x ^ (x >>> 15);
  return x >>> 0;
}
const rnd01 = (i, salt) => hash32((Math.imul(i, 2654435761) ^ salt) | 0) / 4294967296;

// t 对 field_phase 的影响是 2π 周期的，取模可避免长时间运行后 fract() 精度塌掉
const TAU = 6.283185307179586;
const wrapTau = (t) => t - Math.floor(t / TAU) * TAU;

// ===== Cell buffer =====
// color : vec4(R,G,B,A)  —— 交换标的物，初始为随机颜色
// 排序键 key 不再单独存储：它由 color 导出（明度 / 色相），
// 相位则属于位置本身（field_phase(p)），像素不再携带相位。
const cellBuf = device.createBuffer({
  size: TOTAL * CELL_WORDS * 4,
  usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
});

function initCells() {
  const ab = new ArrayBuffer(TOTAL * CELL_WORDS * 4);
  const u = new Uint32Array(ab);
  const f = new Float32Array(ab);
  for (let i = 0; i < TOTAL; i++) {
    const o = i * CELL_WORDS;
    u[o+0] = 0;                                 // swapped（本轮是否交换，调试视图用）
    // color @ word4..7（vec4，需 16 字节对齐 → word4）
    f[o+4] = rnd01(i, 1);                       // R
    f[o+5] = rnd01(i, 2);                       // G
    f[o+6] = rnd01(i, 3);                       // B
    f[o+7] = 1.0;                               // A
  }
  device.queue.writeBuffer(cellBuf, 0, ab);
}
initCells();

// ===== Field uniform =====
const fpBuf = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

// ===== Render uniform =====
// 追加 wave(t,kx,ky)，让渲染侧也能算出「位置相位」（相位属于 position）
const rpBuf = device.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const RP = new ArrayBuffer(48);
const rpU = new Uint32Array(RP);
const rpF = new Float32Array(RP);
function writeRP(t, perX, perY, axis) {
  rpU[0] = W; rpU[1] = H; rpU[2] = 0; rpU[3] = 0;
  rpF[4] = REZ; rpF[5] = REZ; rpF[6] = REZ / W; rpF[7] = axis;   // screen.w 传当前轴给渲染侧
  rpF[8] = wrapTau(t);
  rpF[9] = 2 * Math.PI / perX;                 // kx
  rpF[10] = 2 * Math.PI / perY;                // ky
  rpF[11] = 0;
  device.queue.writeBuffer(rpBuf, 0, RP);
}
writeRP(0, 16, 20, 1);

// ========================================================
//  WGSL: compute
//  1-Pass 协议（单趟）：
//    pass_SWAP（位置单数像素当裁决者，独占读写一对 color 直接交换）
//  帧号决定轴，位置奇偶决定方向，配对唯一、谓词对称。
// ========================================================
const computeWGSL = /* wgsl */`
// 布局必须与 JS 侧一致：32B（swapped@0, color@16）
// 相位属于 position：像素只携带 color（键由 color 导出）
struct Cell {
  swapped:  u32,       // 0=未交换 1=交换（调试视图用）
  color:    vec4<f32>, // @16 交换标的物 RGBA（键由它导出）
};

struct FieldParams {
  dims:  vec4<u32>, // W, H, _, _
  wave:  vec4<f32>, // t, kx, ky, _
  phase: vec4<f32>, // (相位图增益), _, _, _
  misc:  vec4<f32>, // gain_eps, _, key_mode(0=明度,1=色相), axis(0=X,1=Y)
};

@group(0) @binding(0) var<storage, read_write> cells: array<Cell>;
@group(0) @binding(1) var<uniform> fp: FieldParams;

fn gw() -> u32 { return fp.dims.x; }
fn gh() -> u32 { return fp.dims.y; }
fn idx(x: u32, y: u32) -> u32 { return x + y * gw(); }

// 正弦场在位置 p 的相位 —— 相位属于 position，是纯位置函数
fn field_phase(p: vec2<f32>) -> f32 {
  let w = fp.wave;
  return w.y * p.x + w.z * p.y + w.x;
}

// 颜色 → 排序键 ∈ [0, 2π)
//   key_mode=0：明度 luma ∈ [0,1] → [0,2π)
//   key_mode=1：色相 hue ∈ [0,1) → [0,2π)
fn key_of(c: vec4<f32>) -> f32 {
  if (fp.misc.z > 0.5) {
    // 标准 RGB→HSV 色相角
    let mx = max(c.r, max(c.g, c.b));
    let mn = min(c.r, min(c.g, c.b));
    let d  = mx - mn;
    if (d < 1e-6) { return 0.0; }              // 灰度：色相无定义
    var h = 0.0;
    if      (mx == c.r) { h = (c.g - c.b) / d; }
    else if (mx == c.g) { h = 2.0 + (c.b - c.r) / d; }
    else                { h = 4.0 + (c.r - c.g) / d; }
    h = h / 6.0;
    if (h < 0.0) { h = h + 1.0; }
    return h * 6.2831853;
  }
  // Rec.709 明度
  let luma = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
  return clamp(luma, 0.0, 1.0) * 6.2831853;
}

// 亲和性 ∈ [-1,1]
fn affinity(k: f32, p: vec2<f32>) -> f32 {
  return cos(field_phase(p) + k);
}

// 对称交换增益：交换后总亲和 − 当前总亲和（(i,j) 交换逐项相等）
fn swap_gain(ki: f32, kj: f32,
             pi: vec2<f32>, pj: vec2<f32>) -> f32 {
  let cur = affinity(ki, pi) + affinity(kj, pj);
  let swp = affinity(kj, pi) + affinity(ki, pj);
  return swp - cur;
}

// ========================================================
//  1-Pass 协议（单趟完成）
//    帧号决定轴（misc.w=0→X，1→Y）。
//    仅「位置单数」像素作为裁决者（X 轴看 x 奇偶、Y 轴看 y 奇偶），
//    朝 -axis 方向配对唯一偶数伙伴 → 对称谓词使整对同换同不换。
//    裁决者独占读写该对的两个 color（无跨线程竞争），
//    故无需 stage 中转、也无需第二趟提交。
// ========================================================

// 单 Pass 交换：仅位置单数像素当裁决者，独占读写它那一对的两个 color
@compute @workgroup_size(8, 8)
fn pass_SWAP(@builtin(global_invocation_id) gid: vec3<u32>) {
  if (gid.x >= gw() || gid.y >= gh()) { return; }
  let i = idx(gid.x, gid.y);

  let axis = u32(fp.misc.w);
  // 仅坐标单数的像素是裁决者：X 轴看 x 奇偶，Y 轴看 y 奇偶
  let isDecider = select((gid.y & 1u) == 1u, (gid.x & 1u) == 1u, axis == 0u);
  if (!isDecider) { return; }                      // 偶数像素为被动伙伴，由裁决者替它换

  // 单数像素必有一个 -axis 方向的偶数邻居（x-1 / y-1 恒 >= 0）
  var nbr = vec2<i32>(gid.xy);
  if (axis == 0u) { nbr.x = nbr.x - 1; }
  else            { nbr.y = nbr.y - 1; }
  let j = idx(u32(nbr.x), u32(nbr.y));

  // 先把双方旧 color 读进局部变量，再交换 —— 每格 color 仅由本裁决者读写，无竞争
  let ci = cells[i].color;
  let cj = cells[j].color;
  let pi = vec2<f32>(gid.xy);
  let pj = vec2<f32>(vec2<u32>(u32(nbr.x), u32(nbr.y)));
  let g = swap_gain(key_of(ci), key_of(cj), pi, pj);

  if (g > fp.misc.x) {
    // 对称谓词 → 整对要么都换要么都不换；直接交换 color，并标记双方
    cells[i].color = cj;
    cells[j].color = ci;
    cells[i].swapped = 1u;
    cells[j].swapped = 1u;
  } else {
    cells[i].swapped = 0u;
    cells[j].swapped = 0u;
  }
}
`;

// ========================================================
//  WGSL: render（4 个视图，共用同一份 cell buffer）
//    fs       像素图     —— color.rgb
//    fs_phase 位置相位场 —— field_phase(p)（相位属于 position）
//    fs_req   决策图     —— 本轮交换（swapped）
//    fs_pair  轴指示图   —— 当前处理轴（X/Y）
// ========================================================
const renderWGSL = /* wgsl */`
struct Cell {
  swapped:  u32,       // 0=未交换 1=交换（调试视图用）
  color:    vec4<f32>, // @16 交换标的物 RGBA（键由它导出）
};

struct RP {
  dims:   vec4<u32>, // W, H, _, _
  screen: vec4<f32>, // REZ, REZ, cellSize, _
  wave:   vec4<f32>, // t, kx, ky, _
};

@group(0) @binding(0) var<storage, read> cells: array<Cell>;
@group(0) @binding(1) var<uniform> rp: RP;

@vertex
fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4<f32> {
  var p = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -1.0),
    vec2<f32>( 3.0, -1.0),
    vec2<f32>(-1.0,  3.0),
  );
  return vec4<f32>(p[vi], 0.0, 1.0);
}

fn cell_at(fc: vec4<f32>) -> vec4<u32> {
  let dims = rp.dims.xy;
  let cs   = rp.screen.z;
  let gx = min(u32(fc.x / cs), dims.x - 1u);
  let gy = min(u32(fc.y / cs), dims.y - 1u);
  return vec4<u32>(gx, gy, gx + gy * dims.x, 0u);
}

// 正弦场在位置 p 的相位（与 compute 侧同式）—— 纯位置函数
fn field_phase(p: vec2<f32>) -> f32 {
  let w = rp.wave;
  return w.y * p.x + w.z * p.y + w.x;
}

// 色相 → RGB（循环色相，用于相位图/配对图）
// 注意：只能在一处做 ±1/3 的错位。若把错位同时加到 t 和 k 上，
// t+k 三个分量恒等 → 输出永远是灰色（相位图会变成黑白雪花）。
fn hue2rgb(h: f32) -> vec3<f32> {
  let k = vec3<f32>(0.0, 2.0 / 3.0, 1.0 / 3.0);
  let p = abs(fract(vec3<f32>(h) + k) * 6.0 - 3.0);
  return clamp(p - 1.0, vec3<f32>(0.0), vec3<f32>(1.0));
}

// 整数哈希 → 0..1（给每一对生成固定颜色）
fn hash01(x0: u32) -> f32 {
  var x = x0;
  x = x ^ (x >> 16u);
  x = x * 0x7feb352du;
  x = x ^ (x >> 15u);
  x = x * 0x846ca68bu;
  x = x ^ (x >> 16u);
  return f32(x & 0x00FFFFFFu) / 16777216.0;
}

// ---- 视图 1：像素图（交换标的物本身） ----
@fragment
fn fs(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let c = cells[cell_at(fc).z];
  return vec4<f32>(c.color.rgb, 1.0);   // 直接画真实颜色
}

// ---- 视图 2：位置相位场（相位是位置的固有属性，不随像素迁移） ----
@fragment
fn fs_phase(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let g = cell_at(fc);
  let p = vec2<f32>(vec2<u32>(g.x, g.y));
  let col = hue2rgb(fract(field_phase(p) / 6.2831853));
  return vec4<f32>(col, 1.0);
}

// ---- 视图 3：决策图（本轮是否交换） ----
//   绿 = 发生交换（swapped）   灰 = 不动
@fragment
fn fs_req(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let g = cell_at(fc);
  let c = cells[g.z];
  let changed = c.swapped == 1u;
  var col = vec3<f32>(0.15, 0.15, 0.20);
  if (changed) { col = vec3<f32>(0.20, 0.95, 0.40); }
  return vec4<f32>(col, 1.0);
}

// ---- 视图 4：轴指示图 ----
//   底色中性稳定（不随轴闪烁）；发生交换的格子按当前轴提亮；
//   左上角小方块（约 24px）指示当前处理轴（X=蓝 / Y=橙）——不再整屏闪。
@fragment
fn fs_pair(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let g = cell_at(fc);
  let c = cells[g.z];
  let axis = u32(rp.screen.w);
  var col = vec3<f32>(0.10, 0.10, 0.13);                 // 稳定中性底
  if (c.swapped == 1u) {
    col = select(vec3<f32>(0.20, 0.55, 0.95), vec3<f32>(0.95, 0.60, 0.22), axis == 1u) * 1.3;
  }
  if (fc.x < 24.0 && fc.y < 24.0) {                      // 角落徽标：仅在小块随轴变色
    col = select(vec3<f32>(0.15, 0.35, 0.95), vec3<f32>(0.95, 0.55, 0.15), axis == 1u);
  }
  return vec4<f32>(col, 1.0);
}
`;

// ===== 编译 =====
const compMod = device.createShaderModule({ code: computeWGSL });
const rendMod = device.createShaderModule({ code: renderWGSL });

// WGSL 编译诊断：shader 一旦编译失败，后续 pipeline/encoder/submit 只会报
// 「Invalid CommandBuffer」，根因被完全吞掉。这里直接把编译信息打出来。
async function reportShaderErrors(mod, label) {
  if (!mod.getCompilationInfo) return;
  const info = await mod.getCompilationInfo();
  for (const m of info.messages) {
    if (m.type === 'error') {
      err(`[${label}] WGSL 第 ${m.lineNum} 行第 ${m.linePos} 列: ${m.message}` +
          (m.source ? `\n${m.source}` : ''));
    } else {
      console.warn(`[${label}] ${m.type} @${m.lineNum}:${m.linePos}`, m.message);
    }
  }
}
await reportShaderErrors(compMod, 'compute');
await reportShaderErrors(rendMod, 'render');

const compBGL = device.createBindGroupLayout({
  entries: [
    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
  ],
});
const rendBGL = device.createBindGroupLayout({
  entries: [
    { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } },
    { binding: 1, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
  ],
});

const compLayout = device.createPipelineLayout({ bindGroupLayouts: [compBGL] });
const rendLayout = device.createPipelineLayout({ bindGroupLayouts: [rendBGL] });

// 用 error scope 捕获 pipeline 校验错误，避免它们退化成 submit 时的 CommandBuffer 报错
device.pushErrorScope('validation');
const pSwap = device.createComputePipeline({ layout: compLayout, compute: { module: compMod, entryPoint: 'pass_SWAP' } });

const mkRenderPipe = (entry) => device.createRenderPipeline({
  layout: rendLayout,
  vertex:   { module: rendMod, entryPoint: 'vs' },
  fragment: { module: rendMod, entryPoint: entry, targets: [{ format }] },
  primitive: { topology: 'triangle-list' },
});
const pipePix  = mkRenderPipe('fs');
const pipePh   = mkRenderPipe('fs_phase');
const pipeReq  = mkRenderPipe('fs_req');
const pipePair = mkRenderPipe('fs_pair');
const pipeErr = await device.popErrorScope();
if (pipeErr) err('管线创建失败: ' + pipeErr.message);

const compBG = device.createBindGroup({
  layout: compBGL,
  entries: [
    { binding: 0, resource: { buffer: cellBuf } },
    { binding: 1, resource: { buffer: fpBuf } },
  ],
});
const rendBG = device.createBindGroup({
  layout: rendBGL,
  entries: [
    { binding: 0, resource: { buffer: cellBuf } },
    { binding: 1, resource: { buffer: rpBuf } },
  ],
});
window.__dbg = {
  device, cellBuf, W, H, CELL_WORDS,
  frameNo: () => frameNo,
  field: () => ({ t: tAcc, perX: +ui.px.value, perY: +ui.py.value, eps: +ui.eps.value, axis: currentAxis }),
};  // 调试用：允许外部读回 buffer

// ===== UI =====
const ui = {
  eps:   document.getElementById('eps'),
  spd:   document.getElementById('spd'),
  rnd:   document.getElementById('rnd'),
  px:    document.getElementById('px'),
  py:    document.getElementById('py'),
  kmode: document.getElementById('kmode'),
  pause: document.getElementById('pause'),
  step:  document.getElementById('step'),
  reset: document.getElementById('reset'),
  fps:   document.getElementById('fps'),
  hud:   document.getElementById('hud'),
  h1:    document.getElementById('h1'),
};
ui.eps.oninput   = () => document.getElementById('epsV').textContent = (+ui.eps.value).toFixed(3);
ui.spd.oninput   = () => document.getElementById('spdV').textContent = (+ui.spd.value).toFixed(2);
ui.rnd.oninput   = () => document.getElementById('rndV').textContent = ui.rnd.value;
ui.px.oninput    = () => document.getElementById('pxV').textContent = ui.px.value;
ui.py.oninput    = () => document.getElementById('pyV').textContent = ui.py.value;

// 点击标题折叠/展开 HUD（折叠后只剩一个小把手，四图区变大）
ui.h1.onclick = () => {
  const min = ui.hud.classList.toggle('min');
  ui.h1.textContent = min ? '▸' : '▾ Sine-Affinity Pixel Flow (2D)';
};

let paused = false;
let stepReq = false;         // 单帧步进请求
ui.pause.onclick = () => { paused = !paused; ui.pause.textContent = paused ? 'Resume' : 'Pause'; };
ui.step.onclick  = () => { stepReq = true; };
ui.reset.onclick = () => { initCells(); tAcc = 0; frameNo = 0; };

// ===== Field uniform 写入 =====
const FP = new ArrayBuffer(64);
const fpU = new Uint32Array(FP);
const fpF = new Float32Array(FP);
function writeField(t, perX, perY, eps, axis, keyMode) {
  fpU[0] = W; fpU[1] = H; fpU[2] = 0; fpU[3] = 0;
  fpF[4] = wrapTau(t);
  fpF[5] = 2 * Math.PI / perX;   // kx
  fpF[6] = 2 * Math.PI / perY;   // ky
  fpF[7] = 0;
  fpF[8] = 1;                   // 相位图增益
  fpF[12] = eps;                // gain ε
  fpF[13] = 0;                  // 原 dirMode，2-pass 协议不再使用
  fpF[14] = keyMode;            // 0=颜色明度 1=颜色色相
  fpF[15] = axis;               // 0=X 1=Y（由帧号决定）
  device.queue.writeBuffer(fpBuf, 0, FP);
}

// ===== 主循环 =====
let tAcc = 0;
let frameNo = 0;
let currentAxis = 1;        // 当前处理轴：0=X 1=Y，逐帧交替，保证两轴都被处理
let lastTime = performance.now();
let fpsAcc = 0, fpsCount = 0;

function dispatch(enc, pipeline) {
  const p = enc.beginComputePass();
  p.setPipeline(pipeline);
  p.setBindGroup(0, compBG);
  p.dispatchWorkgroups(Math.ceil(W / 8), Math.ceil(H / 8));
  p.end();
}

function drawView(enc, cx, pipe) {
  const view = cx.getCurrentTexture().createView();
  const rp = enc.beginRenderPass({
    colorAttachments: [{
      view, clearValue: { r: 0, g: 0, b: 0, a: 1 },
      loadOp: 'clear', storeOp: 'store',
    }],
  });
  rp.setPipeline(pipe);
  rp.setBindGroup(0, rendBG);
  rp.draw(3, 1, 0, 0);
  rp.end();
}

function frame() {
  requestAnimationFrame(frame);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  fpsAcc += dt; fpsCount++;
  if (fpsAcc >= 0.5) {
    ui.fps.textContent = 'FPS: ' + (fpsCount / fpsAcc).toFixed(1) + '   Frame: ' + frameNo;
    fpsAcc = 0; fpsCount = 0;
  }

  // 单帧步进：暂停时按 Step 只推进恰好一帧
  const stepping = stepReq;
  stepReq = false;
  const advance = (!paused) || stepping;

  if (advance) tAcc += dt * (+ui.spd.value);

  const eps  = +ui.eps.value;
  const perX = +ui.px.value, perY = +ui.py.value;
  const rounds  = +ui.rnd.value;
  const keyMode = +ui.kmode.value;

  const axis = currentAxis;        // 单帧只处理一个轴，逐帧交替 X/Y
  writeField(tAcc, perX, perY, eps, axis, keyMode);
  writeRP(tAcc, perX, perY, axis);

  const enc = device.createCommandEncoder();

  if (advance) {
    frameNo++;
    for (let r = 0; r < rounds; r++) {
      dispatch(enc, pSwap);        // 单趟交换
    }
    currentAxis = 1 - currentAxis;   // 下一帧切到另一轴，保证 X、Y 都被处理
  }

  drawView(enc, pix.cx,  pipePix);    // 像素图
  drawView(enc, phase.cx, pipePh);    // 相位图
  drawView(enc, req.cx,   pipeReq);   // 决策图
  drawView(enc, pair.cx,  pipePair);  // 轴指示图

  device.queue.submit([enc.finish()]);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
