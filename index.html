<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Sine-Affinity Pixel Flow (2D)</title>
<style>
  html,body{margin:0;padding:0;background:#050508;color:#ccc;
    font-family:'SF Mono',Consolas,monospace;overflow:hidden;height:100%}
  /* HUD 与舞台各占一列（HUD 参与布局，不再压在图上） */
  body{display:flex;align-items:stretch;gap:10px;padding:8px;box-sizing:border-box}
  #hud{flex:0 0 auto;align-self:flex-start;background:rgba(10,10,20,.82);
    backdrop-filter:blur(8px);border:1px solid #223;border-radius:8px;
    padding:10px 12px;font-size:12px;line-height:1.7;min-width:244px;z-index:2}
  #hud.min{min-width:0;padding:5px 8px;border-radius:6px}
  #hud h1{font-size:12px;margin:0 0 8px;color:#8cf;font-weight:600;cursor:pointer;
    user-select:none;white-space:nowrap}
  #hud.min label,#hud.min .row,#hud.min #fps,#hud.min .wave-control{display:none}
  #hud.min h1{margin:0}
  #hud label{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #hud input[type=range]{width:110px}
  #hud label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:112px}
  #hud input[type=file]{width:100%;font-size:10px;color:#8cf;background:#1a2440;
    border:1px solid #345;border-radius:4px;padding:3px;margin-top:2px}
  #hud input[type=file]::file-selector-button{background:#253060;color:#8cf;
    border:1px solid #345;border-radius:3px;font-family:inherit;font-size:10px;
    padding:1px 6px;cursor:pointer;margin-right:6px}
  #hud input[type=file]::file-selector-button:hover{background:#2f3d78}
  #hud select{background:#1a2440;color:#8cf;border:1px solid #345;border-radius:4px;
    font-family:inherit;font-size:11px;padding:2px 4px}
  #hud button{background:#1a2440;color:#8cf;border:1px solid #345;border-radius:4px;
    padding:4px 10px;cursor:pointer;font-family:inherit;font-size:11px;margin-top:4px}
  #hud button:hover{background:#253060}
  #hud .row{display:flex;gap:6px;margin-top:8px}
  #hud .chk{display:flex;gap:12px;margin-top:8px;align-items:center}
  #hud .chk label{justify-content:flex-start;gap:5px;font-size:11px;cursor:pointer;
    border:1px solid #223;border-radius:4px;padding:3px 8px;background:rgba(20,25,45,.6)}
  #hud .chk input[type=checkbox]{accent-color:#8cf;margin:0;cursor:pointer}
  #fps{color:#6f6;font-size:11px;margin-top:6px}
  .wave-control{margin-top:8px;padding:6px;background:rgba(20,25,45,.6);border-radius:4px;border:1px solid #223}
  .wave-control label{margin-bottom:2px}
  .wave-control .hint{font-size:10px;color:#6b7ba8;line-height:1.4;margin-top:3px}
  /* 四视图：紧凑 2×2。方格边长由 JS 按可用空间算出（见 fitStage），
     轨道也用固定像素，避免 1fr 把两张图推到各自半区中心而"散开" */
  #stage{flex:1 1 auto;display:grid;min-width:0;min-height:0;
    place-content:center;gap:6px 8px}
  .cell{display:grid;grid-template-rows:auto 1fr;place-items:center;
    min-width:0;min-height:0}
  .cap{font-size:11px;color:#7a8cff;letter-spacing:.5px;white-space:nowrap;line-height:14px}
  .wrap{display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;min-width:0;min-height:0}
  canvas{display:block;image-rendering:pixelated;border:1px solid #1a1f33}
  #err{position:fixed;inset:0;padding:24px;background:#200;color:#f88;
    display:none;white-space:pre-wrap;font-size:13px;z-index:10}
</style>
</head>
<body>
<div id="hud">
  <h1 id="h1">▾ Sine-Affinity Pixel Flow (2D)</h1>
  <label>Gain ε <span id="epsV">0.000</span><input id="eps" type="range" min="-2" max="2" step="0.01" value="0.000"></label>
  <label>Speed <span id="spdV">1.00</span><input id="spd" type="range" min="0" max="3" step="0.05" value="1"></label>
  <label>Rounds/frame <span id="rndV">1</span><input id="rnd" type="range" min="1" max="4" step="1" value="1"></label>
  <label>Steps/sec <span id="spsV">60</span><input id="sps" type="range" min="1" max="144" step="1" value="60"></label>
  <label>Wave count <span id="waveCountV">2</span><input id="waveCount" type="range" min="1" max="4" step="1" value="2"></label>
  <div class="row">
    <button id="preset1">单波</button>
    <button id="preset2">垂直双波</button>
    <button id="preset3">45°干涉</button>
    <button id="preset4">三波</button>
    <button id="preset5">四波</button>
  </div>
  <div class="wave-control">
    <label>Grid W <span id="gwV">128</span><input id="gw" type="range" min="32" max="256" step="16" value="128"></label>
    <label>Grid H <span id="ghV">128</span><input id="gh" type="range" min="32" max="256" step="16" value="128"></label>
    <div class="hint">波周期按 128 基准网格标定，换分辨率时条纹数不变</div>
  </div>
  <div class="wave-control">
    <label>图片来源 <span id="imgV">随机色</span></label>
    <input id="imgFile" type="file" accept="image/*">
    <div class="row"><button id="imgRandom">恢复随机色</button></div>
    <div class="hint">按「填满裁剪」处理：超出部分裁掉，不够则放大到铺满</div>
  </div>
  <div id="waveControls">
    <div class="wave-control" data-wave="0">
      <label>Wave 1 PerX <span id="w0_pxV">128</span><input id="w0_px" type="range" min="32" max="512" step="1" value="128"></label>
      <label>Wave 1 PerY <span id="w0_pyV">128</span><input id="w0_py" type="range" min="32" max="512" step="1" value="128"></label>
      <label>Wave 1 Amp <span id="w0_ampV">1.0</span><input id="w0_amp" type="range" min="0" max="2" step="0.1" value="1"></label>
      <label>Wave 1 Speed <span id="w0_spdV">1.0</span><input id="w0_spd" type="range" min="0" max="3" step="0.1" value="1"></label>
    </div>
  </div>
  <div class="chk">
    <label><input id="swapX" type="checkbox" checked>交换 X 轴</label>
    <label><input id="swapY" type="checkbox" checked>交换 Y 轴</label>
  </div>
  <label>Pixel comparison <select id="kmode"><option value="0" selected>颜色明度</option><option value="1">颜色色相</option><option value="2">灰度</option></select></label>
  <div class="row"><button id="pause">Pause</button><button id="step">Step</button><button id="reset">Reset</button></div>
  <div id="fps">FPS: --</div>
</div>
<div id="stage">
  <div class="cell"><div class="cap">像素图 color(RGBA)</div><div class="wrap"><canvas id="c"></canvas></div></div>
  <div class="cell"><div class="cap">位置相位场 phase(p)</div><div class="wrap"><canvas id="cphase"></canvas></div></div>
  <div class="cell"><div class="cap">灰值图 gray(key)</div><div class="wrap"><canvas id="cpair"></canvas></div></div>
  <div class="cell"><div class="cap">决策图 swapped</div><div class="wrap"><canvas id="creq"></canvas></div></div>
</div>
<div id="err"></div>

<script type="module">
const err = (msg) => {
  const e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = msg;
  console.error(msg);
};

if (!navigator.gpu) { err('此浏览器不支持 WebGPU。请使用 Chrome 113+ 或开启 flag。'); throw new Error('no webgpu'); }
const adapter = await navigator.gpu.requestAdapter();
if (!adapter) { err('无法获取 GPU adapter'); throw new Error('no adapter'); }
const device = await adapter.requestDevice();
device.addEventListener('uncapturederror', e => err('GPU 错误: ' + e.error.message));

const format = navigator.gpu.getPreferredCanvasFormat();
const mkCanvas = (id) => {
  const cv = document.getElementById(id);
  const cx = cv.getContext('webgpu');
  cx.configure({ device, format, alphaMode: 'opaque' });
  return { cv, cx };
};
const pix   = mkCanvas('c');       // 像素图
const phase = mkCanvas('cphase');  // 相位图
const req   = mkCanvas('creq');    // 请求图
const pair  = mkCanvas('cpair');   // 配对成功图

// ===== 尺寸 =====
// W/H 可在运行时调整：换分辨率要重建 cell buffer 与 bind group
const MIN_GRID = 32, MAX_GRID = 256;
let W = 128, H = 128;
const CELL_WORDS = 8;           // 8 * 4B = 32B / cell (swapped@0, color@16)
// 画布后备存储跟随显示尺寸（×DPR），保证 1:1 采样不缩放、不糊。
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let RES_X = 0, RES_Y = 0;
for (const { cv } of [pix, phase, req, pair]) { cv.width = 512; cv.height = 512; }

// 紧凑 2×2：按舞台可用空间算出每格的显示尺寸，轨道写死像素并整体居中。
// （用 1fr 分列时，两列各宽 500+，正方形只有短边大小，图就被推成"四散"了。）
// 画布保持网格宽高比（W/H 可调时不能拉伸变形），缩到可用框内。
const stageEl = document.getElementById('stage');
function fitStage() {
  const GAP_X = 8, GAP_Y = 6, CAP_H = 16;
  const availW = stageEl.clientWidth, availH = stageEl.clientHeight;
  if (availW <= 0 || availH <= 0) return;
  const boxW = (availW - GAP_X) / 2;            // 一格的可用宽
  const boxH = (availH - GAP_Y) / 2 - CAP_H;    // 一格的可用高（减去标题行）
  if (boxW <= 0 || boxH <= 0) return;
  const ar = W / H;
  let cw = boxW, ch = cw / ar;
  if (ch > boxH) { ch = boxH; cw = ch * ar; }
  cw = Math.max(64, Math.floor(cw));
  ch = Math.max(64, Math.floor(ch));

  stageEl.style.gridTemplateColumns = `${cw}px ${cw}px`;
  stageEl.style.gridTemplateRows = `${ch + CAP_H}px ${ch + CAP_H}px`;
  for (const { cv } of [pix, phase, req, pair]) {
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
  }

  // 后备存储 = 显示尺寸 × DPR（1:1 采样，不缩放不糊）
  const rx = Math.max(64, Math.min(4096, Math.round(cw * DPR)));
  const ry = Math.max(64, Math.min(4096, Math.round(ch * DPR)));
  if (rx === RES_X && ry === RES_Y) return;
  RES_X = rx; RES_Y = ry;
  for (const { cv, cx } of [pix, phase, req, pair]) {
    cv.width = rx; cv.height = ry;
    cx.configure({ device, format, alphaMode: 'opaque' });   // 尺寸变了必须重新 configure
  }
}
new ResizeObserver(fitStage).observe(stageEl);
fitStage();

// 单 Pass 方案：不再需要 cmd / stage 字段（无 NOPE 散点，所有格子都参与交换）

// ===== 确定性随机（Reset 后可复现） =====
function hash32(x) {
  x = (x ^ 61) ^ (x >>> 16);
  x = (x + (x << 3)) | 0;
  x = x ^ (x >>> 4);
  x = Math.imul(x, 0x27d4eb2d);
  x = x ^ (x >>> 15);
  return x >>> 0;
}
const rnd01 = (i, salt) => hash32((Math.imul(i, 2654435761) ^ salt) | 0) / 4294967296;

// t 对 field_phase 的影响是 2π 周期的，取模可避免长时间运行后 fract() 精度塌掉
const TAU = 6.283185307179586;
const wrapTau = (t) => t - Math.floor(t / TAU) * TAU;

// ===== 图片来源 =====
// 默认随机色；用户选图后按「填满裁剪」（cover）采样到 W×H：
//   scale = max(W/iw, H/ih) → 超出部分被裁掉，不足则放大到铺满。
let srcImage = null;     // ImageBitmap / HTMLImageElement
let srcCanvas = null, srcCtx = null;

function sampleImage(w, h) {
  if (!srcCanvas) {
    srcCanvas = document.createElement('canvas');
    srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
  }
  if (srcCanvas.width !== w || srcCanvas.height !== h) {
    srcCanvas.width = w; srcCanvas.height = h;   // 改尺寸会重置上下文状态
  }
  const iw = srcImage.naturalWidth || srcImage.width;
  const ih = srcImage.naturalHeight || srcImage.height;
  const s = Math.max(w / iw, h / ih);
  const dw = iw * s, dh = ih * s;
  srcCtx.imageSmoothingEnabled = s < 1;   // 放大用最近邻，像素图不糊
  srcCtx.fillStyle = '#fff';              // 透明区域合成到白底
  srcCtx.fillRect(0, 0, w, h);
  srcCtx.drawImage(srcImage, (w - dw) / 2, (h - dh) / 2, dw, dh);
  return srcCtx.getImageData(0, 0, w, h).data;
}

// ===== Cell buffer =====
// color : vec4(R,G,B,A)  —— 交换标的物，初始为随机色或用户图片
// 排序键 key 不再单独存储：它由 color 导出（明度 / 色相），
// 相位则属于位置本身（field_phase(p)），像素不再携带相位。
// 改变分辨率 → buffer 大小变化 → 必须重建 buffer 与引用它的 bind group。
let cellBuf = null;

function createCellBuffer() {
  if (cellBuf) cellBuf.destroy();
  cellBuf = device.createBuffer({
    size: W * H * CELL_WORDS * 4,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
  });
}

function initCells() {
  const ab = new ArrayBuffer(W * H * CELL_WORDS * 4);
  const u = new Uint32Array(ab);
  const f = new Float32Array(ab);
  const px = srcImage ? sampleImage(W, H) : null;
  for (let i = 0; i < W * H; i++) {
    const o = i * CELL_WORDS;
    u[o+0] = 0;                                 // swapped（本轮是否交换，调试视图用）
    // color @ word4..7（vec4，需 16 字节对齐 → word4）
    if (px) {
      f[o+4] = px[i*4+0] / 255;                 // R
      f[o+5] = px[i*4+1] / 255;                 // G
      f[o+6] = px[i*4+2] / 255;                 // B
    } else {
      f[o+4] = rnd01(i, 1);                     // R
      f[o+5] = rnd01(i, 2);                     // G
      f[o+6] = rnd01(i, 3);                     // B
    }
    f[o+7] = 1.0;                               // A
  }
  device.queue.writeBuffer(cellBuf, 0, ab);
}
createCellBuffer();
initCells();

// ===== Field uniform =====
// 扩展以支持最多 4 个波分量：每个波需要 (t, kx, ky, _) = 16B
// 总大小：dims(16B) + 4 * wave(16B) + phase(16B) + misc(16B) = 128B
const fpBuf = device.createBuffer({ size: 128, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

// ===== Render uniform =====
// 追加 wave(t,kx,ky)，让渲染侧也能算出「位置相位」（相位属于 position）
// 扩展以支持最多 4 个波分量：每个波需要 (t, kx, ky, amplitude) = 16B
// 总大小：dims(16B) + screen(16B) + 4 * wave(16B) + phase(16B) + misc(16B) = 128B
const rpBuf = device.createBuffer({ size: 128, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const RP = new ArrayBuffer(128);
const rpU = new Uint32Array(RP);
const rpF = new Float32Array(RP);
// 波周期以「参考网格 WAVE_REF」标定：perX/perY 的值不随当前分辨率变化，
// 换分辨率时条纹条数保持不变（画面结构不变，只是采样更细）。
const WAVE_REF = 128;
const kOf = (per, n) => 2 * Math.PI / (per * n / WAVE_REF);
function writeRP(t, waves, axis, keyMode = 0) {
  rpU[0] = W; rpU[1] = H; rpU[2] = 0; rpU[3] = 0;
  // screen: (RES_X, RES_Y, cellSizeX, cellSizeY) —— 渲染侧按比例把片元映射回格子
  rpF[4] = RES_X; rpF[5] = RES_Y; rpF[6] = RES_X / W; rpF[7] = RES_Y / H;

  let totalAmp = 0;
  // 写入 4 个波分量
  for (let i = 0; i < 4; i++) {
    const offset = 8 + i * 4;
    if (i < waves.length) {
      const w = waves[i];
      rpF[offset + 0] = wrapTau(t * w.speed);       // t * speed
      rpF[offset + 1] = kOf(w.perX, W);             // kx
      rpF[offset + 2] = kOf(w.perY, H);             // ky
      rpF[offset + 3] = w.amp;                      // amplitude
      totalAmp += w.amp;
    } else {
      rpF[offset + 0] = 0;
      rpF[offset + 1] = 0;
      rpF[offset + 2] = 0;
      rpF[offset + 3] = 0;
    }
  }

  rpF[24] = 1;                   // 相位图增益
  rpF[25] = waves.length;       // wave_count
  rpF[26] = totalAmp;           // 总振幅（归一化干涉场用，映射到 [0,1]）
  rpF[27] = 0;
  rpF[28] = 0;
  rpF[29] = keyMode;        // 灰值图用的排序键口径（0=明度 1=色相 2=灰度）
  rpF[30] = 0;
  rpF[31] = 0;
  device.queue.writeBuffer(rpBuf, 0, RP);
}
writeRP(0, [{speed: 1, perX: 128, perY: 128, amp: 1}], 1);

const fieldPhase=(vk) =>`
fn field_phase(p: vec2<f32>) -> f32 {
  var acc = 0.0;

  // 关键：对每一波「单独取 sin 再求和」，而不是先把线性相位相加再取 sin。
  // 多个线性相位相加仍是一个线性方向 → 永远只是条纹；
  // 各波正弦值相加才是真正的波叠加/干涉，垂直方向的两波才能形成格子。
  let w0 = ${vk}.wave0;
  acc += w0.w * sin(w0.y * p.x + w0.z * p.y + w0.x);

  let w1 = ${vk}.wave1;
  acc += w1.w * sin(w1.y * p.x + w1.z * p.y + w1.x);

  let w2 = ${vk}.wave2;
  acc += w2.w * sin(w2.y * p.x + w2.z * p.y + w2.x);

  let w3 = ${vk}.wave3;
  acc += w3.w * sin(w3.y * p.x + w3.z * p.y + w3.x);

  return acc;
}
`;

// ========================================================
//  WGSL: compute
//  1-Pass 协议（单趟）：
//    pass_SWAP（位置单数像素当裁决者，独占读写一对 color 直接交换）
//  帧号决定轴，位置奇偶决定方向，配对唯一、谓词对称。
// ========================================================
const computeWGSL = /* wgsl */`
// 布局必须与 JS 侧一致：32B（swapped@0, color@16）
// 相位属于 position：像素只携带 color（键由 color 导出）
struct Cell {
  swapped:  u32,       // 0=未交换 1=交换（调试视图用）
  color:    vec4<f32>, // @16 交换标的物 RGBA（键由它导出）
};

struct FieldParams {
  dims:  vec4<u32>,       // W, H, _, _
  wave0: vec4<f32>,      // 波0: t, kx, ky, amplitude
  wave1: vec4<f32>,      // 波1: t, kx, ky, amplitude
  wave2: vec4<f32>,      // 波2: t, kx, ky, amplitude
  wave3: vec4<f32>,      // 波3: t, kx, ky, amplitude
  phase: vec4<f32>,      // (相位图增益), _, _, _
  misc:  vec4<f32>,      // gain_eps, flip, key_mode(0=明度,1=色相), axis(0=X,1=Y)
};

@group(0) @binding(0) var<storage, read_write> cells: array<Cell>;
@group(0) @binding(1) var<uniform> fp: FieldParams;

fn gw() -> u32 { return fp.dims.x; }
fn gh() -> u32 { return fp.dims.y; }
fn idx(x: u32, y: u32) -> u32 { return x + y * gw(); }

${fieldPhase('fp')}

// 颜色 → 排序键 ∈ [0, 2π)
//   key_mode=0：明度 luma ∈ [0,1] → [0,2π)
//   key_mode=1：色相 hue ∈ [0,1) → [0,2π)
// 颜色 → 排序键 ∈ [0, 2π)
//   key_mode=0：明度 luma ∈ [0,1] → [0,2π)
//   key_mode=1：色相 hue ∈ [0,1) → [0,2π)
//   key_mode=2：灰度 gray ∈ [0,1] → [0,2π)
fn key_of(c: vec4<f32>) -> f32 {
  let mode = u32(fp.misc.z);
  
  if (mode == 1u) {
    // 标准 RGB→HSV 色相角
    let mx = max(c.r, max(c.g, c.b));
    let mn = min(c.r, min(c.g, c.b));
    let d  = mx - mn;
    if (d < 1e-6) { return 0.0; }              // 灰度：色相无定义
    var h = 0.0;
    if      (mx == c.r) { h = (c.g - c.b) / d; }
    else if (mx == c.g) { h = 2.0 + (c.b - c.r) / d; }
    else                { h = 4.0 + (c.r - c.g) / d; }
    h = h / 6.0;
    if (h < 0.0) { h = h + 1.0; }
    return h * 6.2831853;
  } 
  
  if (mode == 2u) {
    // 灰度（算术平均）或者你可以用最标准的 (R+G+B)/3
    let gray = (c.r + c.g + c.b) / 3.0;
    return clamp(gray, 0.0, 1.0) * 6.2831853;
  }
  
  // mode == 0：Rec.709 明度（加权平均）
  let luma = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
  return clamp(luma, 0.0, 1.0) * 6.2831853;
}

// 亲和性 ∈ [-1,1]
fn affinity(k: f32, p: vec2<f32>) -> f32 {
  return cos(field_phase(p) + k);
}

// 对称交换增益：交换后总亲和 − 当前总亲和（(i,j) 交换逐项相等）
fn swap_gain(ki: f32, kj: f32,
             pi: vec2<f32>, pj: vec2<f32>) -> f32 {
  let cur = affinity(ki, pi) + affinity(kj, pj);
  let swp = affinity(kj, pi) + affinity(ki, pj);
  return swp - cur;
}

// ========================================================
//  1-Pass 协议（单趟完成）
//    帧号决定轴（misc.w=0→X，1→Y）与匹配相位（misc.y=0 偶相位 / 1 奇相位）。
//    由 flip 决定「哪一侧坐标单数像素当裁决者」，从而切换两种相邻匹配，
//    覆盖全部 (2k,2k+1) 与 (2k+1,2k+2) 相邻对 → 对称谓词使整对同换同不换。
//    裁决者独占读写该对的两个 color（无跨线程竞争），
//    故无需 stage 中转、也无需第二趟提交。
// ========================================================

// 单 Pass 交换：由 flip 决定「谁当裁决者」，从而切换两种匹配、覆盖全部相邻对。
//   flip=0 → 偶相位匹配 (0,1)(2,3)…（奇数位像素发起，朝 -axis 找偶数伙伴）
//   flip=1 → 奇相位匹配 (1,2)(3,4)…（偶数位像素发起，朝 -axis 找奇数伙伴）
// 每格 color 仍只被唯一一个裁决者读写 → 无竞争；奇相位时轴端点会越界→跳过（边界格不交换）。
@compute @workgroup_size(8, 8)
fn pass_SWAP(@builtin(global_invocation_id) gid: vec3<u32>) {
  if (gid.x >= gw() || gid.y >= gh()) { return; }
  let i = idx(gid.x, gid.y);

  let axis = u32(fp.misc.w);
  let flip = fp.misc.y > 0.5;

  // 沿轴坐标是否单数；flip 反转发起方 → 切换两种匹配，覆盖全部相邻对
  let oddA = select((gid.y & 1u) == 1u, (gid.x & 1u) == 1u, axis == 0u);
  let isDecider = (oddA != flip);
  if (!isDecider) { return; }                      // 被动伙伴，由裁决者替它换

  // 裁决者朝 -axis 方向找伙伴
  var nbr = vec2<i32>(gid.xy);
  if (axis == 0u) { nbr.x = nbr.x - 1; }
  else            { nbr.y = nbr.y - 1; }
  if (nbr.x < 0 || nbr.y < 0 || nbr.x >= i32(gw()) || nbr.y >= i32(gh())) { return; }
  let j = idx(u32(nbr.x), u32(nbr.y));

  // 先把双方旧 color 读进局部变量，再交换 —— 每格 color 仅由本裁决者读写，无竞争
  let ci = cells[i].color;
  let cj = cells[j].color;
  let pi = vec2<f32>(gid.xy);
  let pj = vec2<f32>(vec2<u32>(u32(nbr.x), u32(nbr.y)));
  let g = swap_gain(key_of(ci), key_of(cj), pi, pj);

  if (g > fp.misc.x) {
    // 对称谓词 → 整对要么都换要么都不换；直接交换 color，并标记双方
    cells[i].color = cj;
    cells[j].color = ci;
    cells[i].swapped = 1u;
    cells[j].swapped = 1u;
  } else {
    cells[i].swapped = 0u;
    cells[j].swapped = 0u;
  }
}
`;

// ========================================================
//  WGSL: render（4 个视图，共用同一份 cell buffer）
//    fs       像素图     —— color.rgb
//    fs_phase 位置相位场 —— field_phase(p)（相位属于 position）
//    fs_req   决策图     —— 本轮交换（swapped）
//    fs_gray  灰值图     —— 排序键 key_of(color) 的灰阶
// ========================================================
const renderWGSL = /* wgsl */`
struct Cell {
  swapped:  u32,       // 0=未交换 1=交换（调试视图用）
  color:    vec4<f32>, // @16 交换标的物 RGBA（键由它导出）
};

struct RP {
  dims:   vec4<u32>,       // W, H, _, _
  screen: vec4<f32>,      // RES_X, RES_Y, cellSizeX, cellSizeY
  wave0:  vec4<f32>,      // 波0: t, kx, ky, amplitude
  wave1:  vec4<f32>,      // 波1: t, kx, ky, amplitude
  wave2:  vec4<f32>,      // 波2: t, kx, ky, amplitude
  wave3:  vec4<f32>,      // 波3: t, kx, ky, amplitude
  phase:  vec4<f32>,      // (相位图增益), wave_count, totalAmp, _
  misc:   vec4<f32>,      // _, key_mode(0=明度,1=色相,2=灰度), _, _
};

@group(0) @binding(0) var<storage, read> cells: array<Cell>;
@group(0) @binding(1) var<uniform> rp: RP;

@vertex
fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4<f32> {
  var p = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -1.0),
    vec2<f32>( 3.0, -1.0),
    vec2<f32>(-1.0,  3.0),
  );
  return vec4<f32>(p[vi], 0.0, 1.0);
}

// 后备存储尺寸不一定整除网格 → 用比例映射而不是除以 cellSize，避免误差累积
fn cell_at(fc: vec4<f32>) -> vec4<u32> {
  let dims = rp.dims.xy;
  let gx = min(u32(fc.x * f32(dims.x) / rp.screen.x), dims.x - 1u);
  let gy = min(u32(fc.y * f32(dims.y) / rp.screen.y), dims.y - 1u);
  return vec4<u32>(gx, gy, gx + gy * dims.x, 0u);
}

${fieldPhase('rp')}

// 色相 → RGB（循环色相，用于相位图/配对图）
// 注意：只能在一处做 ±1/3 的错位。若把错位同时加到 t 和 k 上，
// t+k 三个分量恒等 → 输出永远是灰色（相位图会变成黑白雪花）。
fn hue2rgb(h: f32) -> vec3<f32> {
  let k = vec3<f32>(0.0, 2.0 / 3.0, 1.0 / 3.0);
  let p = abs(fract(vec3<f32>(h) + k) * 6.0 - 3.0);
  return clamp(p - 1.0, vec3<f32>(0.0), vec3<f32>(1.0));
}

// 整数哈希 → 0..1（给每一对生成固定颜色）
fn hash01(x0: u32) -> f32 {
  var x = x0;
  x = x ^ (x >> 16u);
  x = x * 0x7feb352du;
  x = x ^ (x >> 15u);
  x = x * 0x846ca68bu;
  x = x ^ (x >> 16u);
  return f32(x & 0x00FFFFFFu) / 16777216.0;
}

// ---- 视图 1：像素图（交换标的物本身） ----
@fragment
fn fs(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let c = cells[cell_at(fc).z];
  return vec4<f32>(c.color.rgb, 1.0);   // 直接画真实颜色
}

// ---- 视图 2：位置相位场（相位是位置的固有属性，不随像素迁移） ----
@fragment
fn fs_phase(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let g = cell_at(fc);
  let p = vec2<f32>(vec2<u32>(g.x, g.y));
  // field_phase 已是各波正弦的叠加（干涉场，范围约 [-Σamp, Σamp]），
  // 直接按总振幅归一化即可看到格子/干涉图样，不要再套一层 sin（那会重新变回条纹）。
  let phase = field_phase(p);
  let amp = max(rp.phase.z, 1e-3);
  let v = clamp(phase / amp * 0.5 + 0.5, 0.0, 1.0);
  return vec4<f32>(v, v, v, 1.0);
}

// ---- 视图 3：决策图（本轮是否交换） ----
//   绿 = 发生交换（swapped）   灰 = 不动
@fragment
fn fs_req(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let g = cell_at(fc);
  let c = cells[g.z];
  let changed = c.swapped == 1u;
  var col = vec3<f32>(0.15, 0.15, 0.20);
  if (changed) { col = vec3<f32>(0.20, 0.95, 0.40); }
  return vec4<f32>(col, 1.0);
}

// 颜色 → 排序键 ∈ [0, 2π)（与 compute 侧 key_of 同口径，读 rp.misc.y）
//   key_mode=0：Rec.709 明度   1：色相   2：灰度
fn key_of(c: vec4<f32>) -> f32 {
  let mode = u32(rp.misc.y);
  if (mode == 1u) {
    let mx = max(c.r, max(c.g, c.b));
    let mn = min(c.r, min(c.g, c.b));
    let d  = mx - mn;
    if (d < 1e-6) { return 0.0; }
    var h = 0.0;
    if      (mx == c.r) { h = (c.g - c.b) / d; }
    else if (mx == c.g) { h = 2.0 + (c.b - c.r) / d; }
    else                { h = 4.0 + (c.r - c.g) / d; }
    h = h / 6.0;
    if (h < 0.0) { h = h + 1.0; }
    return h * 6.2831853;
  }
  if (mode == 2u) {
    return clamp((c.r + c.g + c.b) / 3.0, 0.0, 1.0) * 6.2831853;
  }
  let luma = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
  return clamp(luma, 0.0, 1.0) * 6.2831853;
}

// ---- 视图 4：灰值图 ----
//   把每个像素的排序键（明度 / 色相 / 灰度，随 Pixel comparison 切换）
//   归一化到 [0,1] 后直接当灰阶画出来：黑=键小、白=键大。
//   与彩色像素图并排看，可以直观判断「搬运的是哪一类亮度」。
@fragment
fn fs_gray(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let g = cell_at(fc);
  let c = cells[g.z];
  let v = clamp(key_of(c.color) / 6.2831853, 0.0, 1.0);
  return vec4<f32>(v, v, v, 1.0);
}
`;

// ===== 编译 =====
const compMod = device.createShaderModule({ code: computeWGSL });
const rendMod = device.createShaderModule({ code: renderWGSL });

// WGSL 编译诊断：shader 一旦编译失败，后续 pipeline/encoder/submit 只会报
// 「Invalid CommandBuffer」，根因被完全吞掉。这里直接把编译信息打出来。
async function reportShaderErrors(mod, label) {
  if (!mod.getCompilationInfo) return;
  const info = await mod.getCompilationInfo();
  for (const m of info.messages) {
    if (m.type === 'error') {
      err(`[${label}] WGSL 第 ${m.lineNum} 行第 ${m.linePos} 列: ${m.message}` +
          (m.source ? `\n${m.source}` : ''));
    } else {
      console.warn(`[${label}] ${m.type} @${m.lineNum}:${m.linePos}`, m.message);
    }
  }
}
await reportShaderErrors(compMod, 'compute');
await reportShaderErrors(rendMod, 'render');

const compBGL = device.createBindGroupLayout({
  entries: [
    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
  ],
});
const rendBGL = device.createBindGroupLayout({
  entries: [
    { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } },
    { binding: 1, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
  ],
});

const compLayout = device.createPipelineLayout({ bindGroupLayouts: [compBGL] });
const rendLayout = device.createPipelineLayout({ bindGroupLayouts: [rendBGL] });

// 用 error scope 捕获 pipeline 校验错误，避免它们退化成 submit 时的 CommandBuffer 报错
device.pushErrorScope('validation');
const pSwap = device.createComputePipeline({ layout: compLayout, compute: { module: compMod, entryPoint: 'pass_SWAP' } });

const mkRenderPipe = (entry) => device.createRenderPipeline({
  layout: rendLayout,
  vertex:   { module: rendMod, entryPoint: 'vs' },
  fragment: { module: rendMod, entryPoint: entry, targets: [{ format }] },
  primitive: { topology: 'triangle-list' },
});
const pipePix  = mkRenderPipe('fs');
const pipePh   = mkRenderPipe('fs_phase');
const pipeReq  = mkRenderPipe('fs_req');
const pipeGray = mkRenderPipe('fs_gray');   // 灰值图（排序键灰阶）
const pipeErr = await device.popErrorScope();
if (pipeErr) err('管线创建失败: ' + pipeErr.message);

// bind group 持有 cellBuf 引用 → 换分辨率重建 buffer 后必须重建 bind group
let compBG = null, rendBG = null;
function rebuildBindGroups() {
  compBG = device.createBindGroup({
    layout: compBGL,
    entries: [
      { binding: 0, resource: { buffer: cellBuf } },
      { binding: 1, resource: { buffer: fpBuf } },
    ],
  });
  rendBG = device.createBindGroup({
    layout: rendBGL,
    entries: [
      { binding: 0, resource: { buffer: cellBuf } },
      { binding: 1, resource: { buffer: rpBuf } },
    ],
  });
}
rebuildBindGroups();
window.__dbg = {
  device,
  get cellBuf() { return cellBuf; },
  get W() { return W; },
  get H() { return H; },
  CELL_WORDS,
  frameNo: () => frameNo,
  // 把 cell buffer 回读到 CPU：Float32Array，每格 8 个 word（color 在 word4..7）
  readCells: async () => {
    const size = W * H * CELL_WORDS * 4;
    const rb = device.createBuffer({ size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(cellBuf, 0, rb, 0, size);
    device.queue.submit([enc.finish()]);
    await rb.mapAsync(GPUMapMode.READ);
    const out = new Float32Array(rb.getMappedRange().slice(0));
    rb.unmap(); rb.destroy();
    return out;
  },
  field: () => {
    const p = swpPattern();
    const st = p.length ? p[swpIdx % p.length] : 0;
    return { t: tAcc, waves: getWaves(), eps: +ui.eps.value,
             axis: st & 1, flip: (st >> 1) & 1, swapOn: p.length > 0 };
  },
};  // 调试用：允许外部读回 buffer

// buffer 与 bind group 必须一起重建，否则会拿到旧 buffer 的引用。
function applyGrid(nw, nh) {
  nw = Math.max(MIN_GRID, Math.min(MAX_GRID, Math.round(nw)));
  nh = Math.max(MIN_GRID, Math.min(MAX_GRID, Math.round(nh)));
  if (nw === W && nh === H) return;
  W = nw; H = nh;

  createCellBuffer();     // 新尺寸 → 新 buffer
  initCells();            // 重新随机初始颜色
  rebuildBindGroups();    // bind group 持有旧 buffer 引用，必须重建
  fitStage();             // 重排 + 重建 canvas 后备存储（内部会按需重新 configure）

  swpIdx = 0;             // 交换态序列重置
  frameNo = 0;
}

  }
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally { URL.revokeObjectURL(url); }
}

    { perX: 100, perY: 100, amp: 1.0, speed: 1.0 },
    { perX: 150, perY: 80, amp: 1.0, speed: 1.2 },
    { perX: 80, perY: 150, amp: 1.0, speed: 0.8 },
    { perX: 120, perY: 120, amp: 0.5, speed: 1.5 }
  ]}
};

// 应用预设
function applyPreset(presetName) {
  const preset = presets[presetName];
  if (!preset) return;

  ui.waveCount.value = preset.count;
  document.getElementById('waveCountV').textContent = preset.count;
  updateWaveControls(preset.count);

  // 设置每个波的参数
  for (let i = 0; i < preset.waves.length; i++) {
    const w = preset.waves[i];
    document.getElementById(`w${i}_px`).value = w.perX;
    document.getElementById(`w${i}_py`).value = w.perY;
    document.getElementById(`w${i}_amp`).value = w.amp;
    document.getElementById(`w${i}_spd`).value = w.speed;
    document.getElementById(`w${i}_pxV`).textContent = w.perX;
    document.getElementById(`w${i}_pyV`).textContent = w.perY;
    document.getElementById(`w${i}_ampV`).textContent = w.amp.toFixed(1);
    document.getElementById(`w${i}_spdV`).textContent = w.speed.toFixed(1);
  }
}

// 绑定预设按钮
document.getElementById('preset1').onclick = () => applyPreset('preset1');
document.getElementById('preset2').onclick = () => applyPreset('preset2');
document.getElementById('preset3').onclick = () => applyPreset('preset3');
document.getElementById('preset4').onclick = () => applyPreset('preset4');
document.getElementById('preset5').onclick = () => applyPreset('preset5');

// 点击标题折叠/展开 HUD（折叠后只剩一个小把手，四图区变大）
ui.h1.onclick = () => {
  const min = ui.hud.classList.toggle('min');
  ui.h1.textContent = min ? '▸' : '▾ Sine-Affinity Pixel Flow (2D)';
};

let paused = false;
let stepReq = false;         // 单帧步进请求
ui.pause.onclick = () => { paused = !paused; ui.pause.textContent = paused ? 'Resume' : 'Pause'; };
ui.step.onclick  = () => { stepReq = true; };
ui.reset.onclick = () => { initCells(); tAcc = 0; frameNo = 0; swpIdx = 0; };

// ===== Field uniform 写入 =====
const FP = new ArrayBuffer(128);
const fpU = new Uint32Array(FP);
const fpF = new Float32Array(FP);
function writeField(t, waves, eps, axis, keyMode, flip) {
  fpU[0] = W; fpU[1] = H; fpU[2] = 0; fpU[3] = 0;

  let totalAmp = 0;
  // 写入 4 个波分量
  for (let i = 0; i < 4; i++) {
    const offset = 4 + i * 4;
    if (i < waves.length) {
      const w = waves[i];
      fpF[offset + 0] = wrapTau(t * w.speed);       // t * speed
      fpF[offset + 1] = kOf(w.perX, W);             // kx
      fpF[offset + 2] = kOf(w.perY, H);             // ky
      fpF[offset + 3] = w.amp;                      // amplitude
      totalAmp += w.amp;
    } else {
      fpF[offset + 0] = 0;
      fpF[offset + 1] = 0;
      fpF[offset + 2] = 0;
      fpF[offset + 3] = 0;
    }
  }

  fpF[20] = 1;                   // 相位图增益
  fpF[21] = waves.length;       // wave_count
  fpF[22] = totalAmp;           // 总振幅（干涉场归一化用）
  fpF[24] = eps;                // gain ε
  fpF[25] = flip;               // 0=偶相位匹配 1=奇相位匹配（覆盖互补相邻对）
  fpF[26] = keyMode;            // 0=颜色明度 1=颜色色相
  fpF[27] = axis;               // 0=X 1=Y（由帧号决定）
  fpF[28] = 0;
  fpF[29] = 0;
  fpF[30] = 0;
  fpF[31] = 0;
  device.queue.writeBuffer(fpBuf, 0, FP);
}

// ===== 主循环 =====
let tAcc = 0;
let stepAcc = 0;            // Steps/sec 节流累积器（真实秒）
const STEP_DT = 1 / 60;     // 每步固定的时间增量（与帧率解耦）
let frameNo = 0;
let swpIdx = 0;             // 在「启用的 (轴, 匹配相位) 组合」序列里循环推进
// 态编码：0=X偶 1=Y偶 2=X奇 3=Y奇；勾选框决定哪些态参与循环（两个都不勾 → 完全不交换）
function swpPattern() {
  const p = [];
  if (ui.swapX.checked) { p.push(0, 2); }
  if (ui.swapY.checked) { p.push(1, 3); }
  return p;
}
let lastTime = performance.now();
let fpsAcc = 0, fpsCount = 0;

function dispatch(enc, pipeline) {
  const p = enc.beginComputePass();
  p.setPipeline(pipeline);
  p.setBindGroup(0, compBG);
  p.dispatchWorkgroups(Math.ceil(W / 8), Math.ceil(H / 8));
  p.end();
}

function drawView(enc, cx, pipe) {
  const view = cx.getCurrentTexture().createView();
  const rp = enc.beginRenderPass({
    colorAttachments: [{
      view, clearValue: { r: 0, g: 0, b: 0, a: 1 },
      loadOp: 'clear', storeOp: 'store',
    }],
  });
  rp.setPipeline(pipe);
  rp.setBindGroup(0, rendBG);
  rp.draw(3, 1, 0, 0);
  rp.end();
}

function frame() {
  requestAnimationFrame(frame);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  fpsAcc += dt; fpsCount++;
  if (fpsAcc >= 0.5) {
    ui.fps.textContent = 'FPS: ' + (fpsCount / fpsAcc).toFixed(1) + '   Frame: ' + frameNo;
    fpsAcc = 0; fpsCount = 0;
  }

  // 步进节流：用 Steps/sec 把模拟步进速率与帧率解耦
  const stepping = stepReq;
  stepReq = false;

  const sps = +ui.sps.value;
  const dtStep = 1 / sps;                 // 每步对应的真实秒数
  let doStep = false;
  if (!paused) {
    stepAcc += dt;
    if (stepAcc >= dtStep) {              // 一帧内至多一步（受刷新率上限约束）
      doStep = true;
      stepAcc = stepAcc % dtStep;         // 保留余量，也避免高频 sps 下无限累积
    }
  } else {
    stepAcc = 0;                          // 暂停时不累积，恢复后不突进
  }
  if (stepping) { doStep = true; stepAcc = 0; }   // 手动单步：强制一步

  const advance = doStep;
  if (advance) tAcc += STEP_DT * (+ui.spd.value);   // 每步固定时间增量，与帧率无关

  const eps  = +ui.eps.value;
  const rounds  = +ui.rnd.value;
  const keyMode = +ui.kmode.value;
  const waves = getWaves();

  // 4 态循环：轴(X/Y) × 匹配相位(偶/奇)，覆盖全部相邻对；
  // 只保留勾选框启用的态，未启用的轴不再出现空转帧
  const pat = swpPattern();
  const st  = pat.length ? pat[swpIdx % pat.length] : 0;
  const axis = st & 1;                  // 0=X 1=Y
  const flip = (st >> 1) & 1;           // 0=偶相位 1=奇相位
  writeField(tAcc, waves, eps, axis, keyMode, flip);
  writeRP(tAcc, waves, axis, keyMode);   // 灰值图与决策用同一套键口径

  const enc = device.createCommandEncoder();

  if (advance) {
    frameNo++;
    if (pat.length) {                       // 两个轴都取消勾选 → 跳过交换，画面冻结
      for (let r = 0; r < rounds; r++) {
        dispatch(enc, pSwap);       // 单趟交换
      }
      swpIdx++;   // 下一帧切到 (轴, 匹配相位) 的下一态
    }
  }

  drawView(enc, pix.cx,  pipePix);    // 像素图
  drawView(enc, phase.cx, pipePh);    // 相位图
  drawView(enc, req.cx,   pipeReq);   // 决策图
  drawView(enc, pair.cx,  pipeGray);  // 灰值图

  device.queue.submit([enc.finish()]);
}
requestAnimationFrame(frame);
</script>
